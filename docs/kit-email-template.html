<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>SoulFlow Melbourne Daily Picks</title>
<style>
  @media only screen and (max-width: 600px) {
    .sf-container { width: 100% !important; max-width: 100% !important; }
    .sf-card-cell { padding: 14px !important; }
    .sf-card-img { width: 96px !important; height: 96px !important; }
    .sf-btn { display: block !important; width: 100% !important; text-align: center !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#F8F1EA;font-family:Inter,Helvetica,Arial,sans-serif;color:#1C1C1C;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8F1EA;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" class="sf-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background-color:#B34629;padding:24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="48" style="vertical-align:middle;">
                    <div style="width:40px;height:40px;line-height:40px;text-align:center;border-radius:50%;background-color:#D9B75B;color:#1C1C1C;font-weight:800;font-size:20px;font-family:Georgia,serif;">S</div>
                  </td>
                  <td style="padding-left:12px;vertical-align:middle;">
                    <div style="color:#F8F1EA;font-size:22px;font-weight:800;letter-spacing:0.5px;">SoulFlow</div>
                    <div style="color:#F8F1EA;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.9;">Melbourne Daily Picks</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 16px 32px;font-size:16px;line-height:1.6;color:#1C1C1C;">
              {{ content }}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 32px;background-color:#F8F1EA;border-top:1px solid #E8D9C8;">
              <p style="margin:0 0 8px 0;font-size:13px;color:#4B3B2B;">Reply to this email at <a href="mailto:soulconsciousevents@gmail.com" style="color:#B34629;text-decoration:none;">soulconsciousevents@gmail.com</a>.</p>
              <p style="margin:0 0 8px 0;font-size:12px;color:#4B3B2B;">SoulFlow, Melbourne, VIC 3000, Australia</p>
              <p style="margin:0;font-size:12px;color:#4B3B2B;"><a href="{{ unsubscribe_url }}" style="color:#B34629;text-decoration:underline;">Unsubscribe</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
