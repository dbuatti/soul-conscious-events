name: Import Events

on:
  schedule:
    # Every morning, ~6:45am AEST / 7:45am AEDT.
    - cron: '45 20 * * *'
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: import-events
  cancel-in-progress: false

jobs:
  import:
    # Pinned to the LTS image: "ubuntu-latest" moves to Ubuntu 26 on 19 Oct 2026,
    # and an unexpected break here fails silently at 6:45am with nobody watching.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same token the deploy workflow uses; nothing extra to configure.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tbyjdhxpbfvqsrzzdjwi
    steps:
      - name: Check access token is configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping: add a SUPABASE_ACCESS_TOKEN repository secret to enable daily imports."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          # Pinned: resolving "latest" hits the GitHub API and fails with
          # "rate limit exceeded" from shared runner IPs, which broke the first
          # scheduled run. Bump this deliberately.
          version: 2.119.0

      - name: Run importer
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # Look up the project's service-role key with the access token so no
          # second secret is needed. Never print the raw output: it contains keys.
          find_key() {
            jq -r '[.[] | select(.name == "service_role")][0].api_key // empty' 2>/dev/null
          }
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json 2>/dev/null | find_key || true)
          if [ -z "$KEY" ]; then
            KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json --reveal 2>/dev/null | find_key || true)
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Couldn't read the service_role key with SUPABASE_ACCESS_TOKEN. Check the token is valid for this project."
            exit 1
          fi
          echo "::add-mask::$KEY"

          RESPONSE=$(curl -sS --max-time 170 -w '\n%{http_code}' -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/import-events" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          STATUS=$(tail -n1 <<<"$RESPONSE")
          BODY=$(sed '$d' <<<"$RESPONSE")

          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Importer returned HTTP $STATUS"
            exit 1
          fi

          ADDED=$(echo "$BODY" | jq -r '.events_added // 0')
          echo "### Event import" >> "$GITHUB_STEP_SUMMARY"
          echo "$ADDED new event(s) waiting for review in the admin panel." >> "$GITHUB_STEP_SUMMARY"
          echo "$BODY" | jq -r '.sources[]? | "- **\(.status)** \(.url) — \(.message)"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
