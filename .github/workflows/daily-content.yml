name: Daily content

on:
  schedule:
    # 08:00 Australia/Sydney, every day. Two UTC slots cover daylight saving:
    #   21:00 UTC = 08:00 AEDT (summer)
    #   22:00 UTC = 08:00 AEST (winter)
    # The script checks the Sydney clock, so the wrong slot is a no-op.
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the Sydney time check (post now)
        type: boolean
        default: false
      day:
        description: Override the day (Mon, Tue, Wed, Thu, Fri, Sat, Sun)
        required: false
      states:
        description: Comma-separated states for the Tue-Sat slots
        required: false
      theme:
        description: Override the Sunday brand theme (intro, organisers, locations, meet-organiser, values, quote, tips)
        required: false

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tbyjdhxpbfvqsrzzdjwi
    steps:
      - name: Check access token is configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping: add a SUPABASE_ACCESS_TOKEN repository secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 2.119.0

      - name: Look up the service-role key
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          if [ -z "$key" ]; then
            echo "::error::Could not look up the service-role key."
            exit 1
          fi
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${key}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate & publish today's content
        if: steps.guard.outputs.skip != 'true'
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          DAY: ${{ github.event.inputs.day || '' }}
          STATES: ${{ github.event.inputs.states || 'VIC,QLD,SA,TAS,NSW' }}
          THEME: ${{ github.event.inputs.theme || '' }}
        run: node scripts/daily-content.mjs
