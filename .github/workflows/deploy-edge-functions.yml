name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: # Manual "deploy everything" button in the Actions tab

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Create at https://supabase.com/dashboard/account/tokens and add as a repo secret.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tbyjdhxpbfvqsrzzdjwi
    steps:
      - uses: actions/checkout@v4

      - name: Check access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # Shared modules (e.g. _shared) are bundled into functions, not deployed.
            [[ "$name" == _* ]] && continue
            [ -f "$dir/index.ts" ] || continue

            # cron-ping is called by the keep-alive workflow without a JWT.
            # Every other function requires a signed-in caller (and checks roles itself).
            flags=()
            if [ "$name" = "cron-ping" ]; then
              flags+=(--no-verify-jwt)
            fi

            echo "::group::Deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF" "${flags[@]}"
            echo "::endgroup::"
          done
