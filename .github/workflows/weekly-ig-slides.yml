name: Weekly IG Slides (Phase 1)

on:
  schedule:
    # Monday 00:00 UTC -- Sunday evening in Sydney.
    - cron: '0 0 * * MON'
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: weekly-ig-slides
  cancel-in-progress: false

jobs:
  generate:
    # Pinned to the LTS image, matching the importer: "ubuntu-latest" moves to
    # Ubuntu 26 on 19 Oct 2026 and an unexpected break fails with nobody watching.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same token the deploy and import workflows use; nothing extra to configure.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tbyjdhxpbfvqsrzzdjwi
    steps:
      - name: Check access token is configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping: add a SUPABASE_ACCESS_TOKEN repository secret to enable weekly slides."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          # Pinned for the same reason as the importer: "latest" resolves through
          # the GitHub API and gets rate-limited from shared runner IPs.
          version: 2.119.0

      - name: Render the week's slides
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # Look up the service-role key with the access token so no second
          # secret is needed. Never print the raw output: it contains keys.
          find_key() {
            jq -r '[.[] | select(.name == "service_role")][0].api_key // empty' 2>/dev/null
          }
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json 2>/dev/null | find_key || true)
          if [ -z "$KEY" ]; then
            KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json --reveal 2>/dev/null | find_key || true)
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Couldn't read the service_role key with SUPABASE_ACCESS_TOKEN. Check the token is valid for this project."
            exit 1
          fi
          echo "::add-mask::$KEY"

          RESPONSE=$(curl -sS --max-time 170 -w '\n%{http_code}' -X POST \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/weekly-ig-slides" \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          STATUS=$(tail -n1 <<<"$RESPONSE")
          BODY=$(sed '$d' <<<"$RESPONSE")

          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::weekly-ig-slides returned HTTP $STATUS"
            exit 1
          fi

          WEEK=$(echo "$BODY" | jq -r '.weekStart // "?"')
          COUNT=$(echo "$BODY" | jq -r '.eventCount // 0')
          echo "### Weekly IG slides" >> "$GITHUB_STEP_SUMMARY"
          echo "$COUNT event(s) rendered for the week starting $WEEK." >> "$GITHUB_STEP_SUMMARY"
          echo "$BODY" | jq -r '.slides[]? | "- \(.publicUrl)"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$(echo "$BODY" | jq -r '.email.sent // false')" != "true" ]; then
            echo "::warning::Slides rendered but the email was not sent (check RESEND_API_KEY and SLIDES_EMAIL_TO)."
          fi
