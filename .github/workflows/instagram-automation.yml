name: Instagram automation

on:
  schedule:
    # Hourly. Only batches whose scheduled_for has passed get posted.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_id:
        description: Optional specific batch id to publish now
        required: false

concurrency:
  group: instagram-automation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tbyjdhxpbfvqsrzzdjwi
    steps:
      - name: Check access token is configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping: add a SUPABASE_ACCESS_TOKEN repository secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 2.119.0

      - name: Look up the service-role key
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          if [ -z "$key" ]; then
            echo "::error::Could not resolve the service_role key."
            exit 1
          fi
          echo "::add-mask::$key"
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_SERVICE_ROLE_KEY=$key"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish scheduled carousels
        if: steps.guard.outputs.skip != 'true'
        env:
          BATCH_ID: ${{ github.event.inputs.batch_id }}
        run: node scripts/instagram-automation.mjs