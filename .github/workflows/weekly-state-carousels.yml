name: Weekly state carousels

on:
  schedule:
    # 08:00 Monday, Australia/Sydney. Two UTC slots cover daylight saving:
    #   21:00 Sunday UTC = 08:00 AEDT (summer)
    #   22:00 Sunday UTC = 08:00 AEST (winter)
    # The script itself checks the Sydney clock, so the wrong slot is a no-op.
    - cron: '0 21 * * 0'
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the Sydney time check (post now)
        type: boolean
        default: false
      states:
        description: Comma-separated states to run (default all)
        required: false

concurrency:
  group: weekly-state-carousels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tbyjdhxpbfvqsrzzdjwi
    steps:
      - name: Check access token is configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping: add a SUPABASE_ACCESS_TOKEN repository secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 2.119.0

      - name: Look up the service-role key
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          if [ -z "$key" ]; then
            echo "::error::Could not look up the service-role key."
            exit 1
          fi
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${key}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate & publish state carousels
        if: steps.guard.outputs.skip != 'true'
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          STATES: ${{ github.event.inputs.states }}
        run: node scripts/weekly-state-carousels.mjs